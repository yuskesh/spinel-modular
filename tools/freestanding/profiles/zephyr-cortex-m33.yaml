# The platform-first form of cortex-m33-zephyr.yaml.
#
# The platform-first spelling: (platform, arch) select the target/abi/runtime
# facts through the ledger (tools/platform/menus.yaml -> the target-first base
# file, verbatim), `supplies:` says what this module receives from the
# platform, `externs:` is the same explicit extern list.  supplies: trap-only is the honest
# name for this surface -- the ONLY thing the old file's externs list carries
# is the trap hook, which is implied.
#
# The target-first file stays beside this one: the lanes under
# tests/freestanding read it.
platform: zephyr
arch: cortex-m33            # zephyr's arch menu has two entries; chosen, not derived
supplies: trap-only
